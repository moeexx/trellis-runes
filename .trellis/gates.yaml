version: 1

gates:
  task_create:
    require:
      - session_activated_for_create

  task_start:
    transition:
      from: planning
      to: in_progress
      idempotent: true
    require:
      - task_json_ready
      - planning_artifacts_ready
      - test_plan_ready
      - context_ready
      - session_activated_for_start

  context_validate:
    require:
      - context_ready

  task_archive:
    transition:
      from: in_progress
      to: completed
    require:
      - task_json_ready
      - archive_branch_metadata
      - archive_destination_available
      - test_plan_unchanged
      - baseline_diff_clean
      - findings_resolved
